# Real Google sign-in for the local stack (docs/milestones/m2_prototype_review/implementation-plan.md, "Next: real Google/YouTube test").
# Values come from .env (git-ignored): GOOGLE_CLIENT_ID. Sign-in is invite-only:
# invite your Google email first, e.g.
#   docker compose run --rm --entrypoint li-admin seed create-superuser you@gmail.com
x-google-env: &google-env
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set in .env}
  LI_DEV_AUTH: "0"
services:
  migrate: { environment: *google-env }
  seed:    { environment: *google-env }
  ingest:  { environment: *google-env }
  search:  { environment: *google-env }
