# Included in every location that serves files (nginx drops inherited
# add_header lines when a location adds its own). __API_ORIGIN__ is replaced
# with VITE_API_BASE at build time; empty for local builds.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/ __API_ORIGIN__; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
