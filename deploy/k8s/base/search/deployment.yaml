apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  labels:
    app.kubernetes.io/name: search
spec:
  # No replicas field: the HorizontalPodAutoscaler owns the count.
  selector:
    matchLabels:
      app.kubernetes.io/name: search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search
    spec:
      serviceAccountName: search
      # Spot pods cost ~60-90% less; GKE gives them 25 s notice before eviction.
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Native sidecar (restartPolicy: Always): starts before the app, stops after it.
        # Connects to Cloud SQL's private IP and logs in with this pod's IAM identity.
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.2
          restartPolicy: Always
          args:
            - --auto-iam-authn
            - --private-ip
            - --structured-logs
            - --health-check
            - --http-address=0.0.0.0
            - --port=5432
            - $(CLOUDSQL_CONNECTION_NAME)
          env:
            - name: CLOUDSQL_CONNECTION_NAME
              valueFrom:
                configMapKeyRef: { name: li-config, key: CLOUDSQL_CONNECTION_NAME }
          startupProbe:
            httpGet: { path: /startup, port: 9090 }
            periodSeconds: 1
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /liveness, port: 9090 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: app
          image: search
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SEARCH_DB_USER
              valueFrom:
                configMapKeyRef: { name: li-config, key: SEARCH_DB_USER }
            # The proxy handles TLS and the IAM token; locally it's plain TCP.
            - name: DATABASE_URL
              value: host=127.0.0.1 port=5432 dbname=li user=$(SEARCH_DB_USER) sslmode=disable
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef: { name: li-config, key: GOOGLE_CLIENT_ID }
            - name: PROFESSOR_EMAILS
              valueFrom:
                configMapKeyRef: { name: li-config, key: PROFESSOR_EMAILS }
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef: { name: li-config, key: CORS_ORIGINS }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            # gunicorn needs a writable temp dir; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
