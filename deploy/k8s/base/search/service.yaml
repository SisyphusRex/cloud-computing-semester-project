apiVersion: v1
kind: Service
metadata:
  name: search
  annotations:
    # Container-native load balancing: the load balancer sends traffic straight to pod IPs.
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "search"}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: search
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Load balancer settings for this backend.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: search
spec:
  timeoutSec: 30
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 8080
