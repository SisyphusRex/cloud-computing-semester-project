# Nothing in the namespace accepts traffic except the API pods on :8080, and
# only from Google's load balancer and health-check ranges. Kubelet probes are
# node-local and always allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-load-balancer
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [ingest, search] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 35.191.0.0/16 }
        - ipBlock: { cidr: 130.211.0.0/22 }
      ports:
        - port: 8080
