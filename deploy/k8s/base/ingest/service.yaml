apiVersion: v1
kind: Service
metadata:
  name: ingest
  annotations:
    # Container-native load balancing: the load balancer sends traffic straight to pod IPs.
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "ingest"}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ingest
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Load balancer settings for this backend.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: ingest
spec:
  timeoutSec: 120
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 8080
