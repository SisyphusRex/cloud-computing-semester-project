# Public HTTPS entry point: an external Application Load Balancer on the
# reserved global IP li-api, with a Google-managed certificate for API_HOSTNAME.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: li-api
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: li-api
    networking.gke.io/managed-certificates: li-api
    networking.gke.io/v1beta1.FrontendConfig: li-api
spec:
  rules:
    - host: API_HOSTNAME
      http:
        paths:
          - path: /ingest
            pathType: Prefix
            backend:
              service: { name: ingest, port: { name: http } }
          - path: /search
            pathType: Prefix
            backend:
              service: { name: search, port: { name: http } }
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: li-api
spec:
  domains:
    - API_HOSTNAME
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: li-api
spec:
  redirectToHttps:
    enabled: true
