# Nightly encrypted pg_dump to Azure (ADR 0004). `make cloud-pause` suspends it,
# since Cloud SQL is stopped then, and takes a backup first.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  labels:
    app.kubernetes.io/name: backup
spec:
  schedule: "0 8 * * *" # 08:00 UTC, the middle of the night in the US
  timeZone: Etc/UTC
  suspend: false
  concurrencyPolicy: Forbid
  # After a long outage, one late run is enough; don't run at a random hour.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: backup
    spec:
      # Spot nodes can disappear mid-run; a retry writes a new blob.
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup
        spec:
          serviceAccountName: backup
          restartPolicy: Never
          nodeSelector:
            cloud.google.com/gke-spot: "true"
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Native sidecar, as in the migrate Job: stopped automatically once
            # the backup container exits. No --auto-iam-authn: logs in as li_admin.
            - name: cloud-sql-proxy
              image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.2
              restartPolicy: Always
              args:
                - --private-ip
                - --structured-logs
                - --health-check
                - --http-address=0.0.0.0
                - --port=5432
                - $(CLOUDSQL_CONNECTION_NAME)
              env:
                - name: CLOUDSQL_CONNECTION_NAME
                  valueFrom:
                    configMapKeyRef: { name: li-config, key: CLOUDSQL_CONNECTION_NAME }
              startupProbe:
                httpGet: { path: /startup, port: 9090 }
                periodSeconds: 1
                failureThreshold: 60
              resources:
                requests: { cpu: 50m, memory: 64Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
          containers:
            - name: backup
              image: backup
              env:
                - { name: PGHOST, value: 127.0.0.1 }
                - { name: PGPORT, value: "5432" }
                - { name: PGDATABASE, value: li }
                - { name: PGUSER, value: li_admin }
                - { name: PGSSLMODE, value: disable }
                # Written in by the values component, not read from li-config:
                # a rollback to a tag from before backups replaces li-config.
                - { name: BACKUP_AGE_RECIPIENT, value: BACKUP_AGE_RECIPIENT }
                - { name: BACKUP_CONTAINER_URL, value: BACKUP_CONTAINER_URL }
              resources:
                requests: { cpu: 250m, memory: 256Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
                - name: work
                  mountPath: /work
          volumes:
            - name: secrets
              csi:
                driver: secrets-store-gke.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: backup
            - name: work
              emptyDir:
                sizeLimit: 1Gi
