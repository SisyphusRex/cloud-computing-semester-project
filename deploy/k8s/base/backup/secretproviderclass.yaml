# GKE Secret Manager add-on: mounts the li_admin password and the upload SAS as files.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backup
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "DB_ADMIN_SECRET_VERSION"
        path: "db-admin-password"
      - resourceName: "BACKUP_SAS_SECRET_VERSION"
        path: "backup-sas"
