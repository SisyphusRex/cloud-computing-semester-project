[project]
name = "li-common"
version = "0.1.0"
description = "Shared auth, database, config, and logging for Lecture Indexer services"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-cors>=5.0",
    "cachecontrol>=0.14",
    "google-auth>=2.30",
    "requests>=2.32",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
]

[project.scripts]
li-migrate = "li_common.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
