name: Deploy frontend

# Builds the SPA into an nginx image and deploys it to Cloud Run. Runs on
# pushes to main that touch the frontend or the production values, and by hand
# (gh workflow run frontend-deploy.yml --ref main). No pause check: Cloud Run
# scales to zero by itself, and a paused API only means the site shows errors.
on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - deploy/k8s/overlays/prod/values/values.env
      - .github/workflows/frontend-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  # Name fixed by infra/terraform/envs/prod (module "frontend").
  SERVICE: li-frontend
  VALUES: deploy/k8s/overlays/prod/values/values.env

jobs:
  ci:
    uses: ./.github/workflows/wait-for-ci.yml
    permissions:
      actions: read

  deploy:
    name: Build and deploy
    needs: ci
    runs-on: ubuntu-24.04
    environment: prod
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/li/frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      # The API hostname and OAuth client ID come from the same file the
      # services read, so filling it in after terraform apply covers both.
      - name: Read production values
        run: |
          value() { sed -n "s/^$1=//p" "$VALUES"; }
          host=$(value API_HOSTNAME)
          client=$(value GOOGLE_CLIENT_ID)
          if [[ -z $host || -z $client || $host == 0-0-0-0.sslip.io || $client == REPLACE_ME* ]]; then
            echo "::error::Fill in API_HOSTNAME and GOOGLE_CLIENT_ID in $VALUES first"
            exit 1
          fi
          {
            echo "API_BASE=https://$host"
            echo "GOOGLE_CLIENT_ID=$client"
          } >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" \
            --build-arg "VITE_API_BASE=$API_BASE" \
            --build-arg "VITE_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" \
            frontend
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --quiet
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "### Deployed \`${GITHUB_SHA:0:7}\` to $url (API: $API_BASE)" >> "$GITHUB_STEP_SUMMARY"
