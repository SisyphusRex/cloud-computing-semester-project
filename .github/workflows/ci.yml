name: CI

# Checks everything that can be checked without cloud credentials.
on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs run on ubuntu-24.04, not ubuntu-latest, so the runner image changes
# only when we change it (ubuntu-latest moves to Ubuntu 26 from 2026-10-19).
env:
  UV_VERSION: "0.13.0"
  KUSTOMIZE_VERSION: "v5.8.3"
  KUBECONFORM_VERSION: "v0.8.0"

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: li
          POSTGRES_PASSWORD: li
          POSTGRES_DB: li
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U li -d li"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://li:li@localhost:5432/li
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tag is published
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/uv.lock
      - run: make install
      - run: make lint
      - run: make test # DATABASE_URL is set, so the database tests run too

  compose:
    name: Docker images and compose smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up --build --detach
      - name: Migrations succeeded
        run: test "$(docker compose ps --all --format '{{.ExitCode}}' migrate)" = 0
      - run: scripts/smoke-test.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  terraform:
    name: Terraform checks (no credentials)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "terraform=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: |
          for root in bootstrap envs/prod; do
            terraform -chdir=$root init -backend=false -input=false
            terraform -chdir=$root validate
          done
      - name: Mocked-provider tests
        run: terraform -chdir=envs/prod test

  k8s:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kustomize
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make k8s-check

  docs:
    name: Document links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make docs-check

  frontend:
    name: Frontend lint, tests, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  frontend-image:
    name: Frontend image (nginx)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/test-frontend-image.sh

  backup-image:
    name: Backup image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/test-backup-image.sh
