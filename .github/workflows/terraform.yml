name: Terraform

# Pull requests: a read-only plan of envs/prod, posted as a PR comment, as an
# early preview. Applies happen only in release.yml, which plans again at
# release time. bootstrap/ is applied by hand only (docs/runbooks/bootstrap.md).
on:
  pull_request:
    paths:
      - infra/terraform/**
      - .github/workflows/terraform.yml

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  # terraform.tfvars is git-ignored; CI passes the same values from repository variables.
  TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_gcp_region: ${{ vars.GCP_REGION }}
  TF_VAR_azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_ci_deploy_service_account: ${{ vars.GCP_DEPLOY_SA }}
  TF_VAR_alert_notification_channel: ${{ vars.ALERT_NOTIFICATION_CHANNEL }}
  # azurerm signs in with GitHub's OIDC token.
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

defaults:
  run:
    working-directory: infra/terraform/envs/prod

jobs:
  plan:
    name: Plan (read-only)
    runs-on: ubuntu-24.04
    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      # Reader can't register resource providers.
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: none
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "terraform=$(cat ../../.terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      # -refresh=false: shows what the change does; the apply job refreshes fully.
      # -lock=false: the plan identity can't write the lock object.
      - name: Plan
        run: |
          set -o pipefail
          terraform plan -refresh=false -lock=false -no-color 2>&1 | tee "$RUNNER_TEMP/plan.txt"
      - name: Comment on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### Terraform plan: \`envs/prod\` ($OUTCOME)"
            echo "Read-only (\`-refresh=false\`), at ${GITHUB_SHA:0:7}. [Run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo '```'
            # PR comments are limited to 65,536 characters.
            tail -c 60000 "$RUNNER_TEMP/plan.txt" 2>/dev/null || echo "(no plan output)"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md" \
            --edit-last --create-if-none
